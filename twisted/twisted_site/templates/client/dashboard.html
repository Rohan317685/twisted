{% extends "client/osbase.html" %} {% load static %} {% block body %}
<div class="h-full text-absolute-white">
    <div class="p-4 flex items-center gap-3">
        <button onclick="newWindow('Projects', '{% url 'fr.projects' %}')"
            class="bg-twisted-400 text-absolute-white font-bold px-4 py-2 border-2 border-t-twisted-200 border-l-twisted-200 border-r-dark-black border-b-dark-black active:border-t-dark-black active:border-l-dark-black active:border-r-twisted-200 active:border-b-twisted-200">
            Projects
        </button>
    </div>

    <div id="windows-container"></div>

    <div id="taskbar" class="fixed bottom-0 left-0 right-0 z-9999 flex items-center justify-between bg-twisted-400 border-t-2 border-t-twisted-200 px-1 py-1">
        <div class="relative">
            <button onclick="toggleStartMenu(event)"
                class="flex items-center gap-1 !bg-twisted-600 !text-base !text-absolute-white !font-bold !px-3 !py-1 !border-2 !border-t-twisted-200 !border-l-twisted-200 !border-r-dark-black !border-b-dark-black active:!border-t-dark-black active:!border-l-dark-black active:!border-r-twisted-200 active:!border-b-twisted-200">
                <img src="{% static 'images/twisted_logo.png' %}" alt="" class="w-8 h-5"> Twist
            </button>

            <div id="start-menu" style="display: none; position: fixed; bottom: 48px; left: 4px; width: 520px;"
                class="z-[10000] bg-twisted-800 border-2 border-t-twisted-200 border-l-twisted-200 border-r-dark-black border-b-dark-black shadow-lg">
                <div class="flex">
                    <div class="flex-1 bg-twisted-999 p-2 space-y-0.5">
                        {% for i in "0123456789" %}
                        <button onclick="newWindow('Projects', '{% url 'fr.projects' %}'); toggleStartMenu(event)"
                            class="w-full flex items-center gap-3 px-2 py-1.5 text-absolute-white text-left hover:bg-twisted-600">
                            <img src="{% static 'images/round-square.jpg' %}" alt=""
                                class="w-7 h-7 object-cover border border-t-twisted-200 border-l-twisted-200 border-r-dark-black border-b-dark-black shrink-0">
                            <span class="text-sm">Projects</span>
                        </button>
                        {% endfor %}
                    </div>

                    <div class="w-44 bg-twisted-600 p-3 pt-10 flex flex-col">
                        <div class="text-center mb-3">
                            <img src="{{ user.profile.slack_pfp_url }}" alt="" class="w-16 h-16 object-cover mx-auto mb-1 -mt-12 border-2 border-t-twisted-200 border-l-twisted-200 border-r-dark-black border-b-dark-black shadow-lg">
                            <div class="text-absolute-white font-bold text-sm font-vintage">
                                {{ profile.slack_username|default:user.username }}
                            </div>
                        </div>

                        <div class="font-vintage space-y-1 text-absolute-white text-sm border-t border-twisted-800 pt-2">
                            {% if user.is_staff %}
                            <a href="/admin/" class="block text-absolute-white px-2 py-1 hover:bg-twisted-800">Supadmin Panel</a>
                            {% endif %}
                            <a href="#" class="block text-absolute-white px-2 py-1 hover:bg-twisted-800">Settings</a>
                            <a href="#" class="block text-absolute-white px-2 py-1 hover:bg-twisted-800">Help</a>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between bg-twisted-400 p-2 border-t-2 border-t-twisted-200">
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit"
                            class="text-absolute-white text-sm px-3 py-1 border-2 border-t-twisted-200 border-l-twisted-200 border-r-dark-black border-b-dark-black active:border-t-dark-black active:border-l-dark-black active:border-r-twisted-200 active:border-b-twisted-200">
                            Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div id="taskbar-windows" class="flex-1 flex items-center gap-1 px-2 overflow-x-auto"></div>

        <div class="flex items-center gap-2">
            <div id="speaker-btn" onclick="toggleMusic()" class="cursor-pointer bg-twisted-600 px-2 py-1 border-2 border-t-twisted-200 border-l-twisted-200 border-r-dark-black border-b-dark-black active:border-t-dark-black active:border-l-dark-black active:border-r-twisted-200 active:border-b-twisted-200">
                <svg id="speaker-icon" width="20" height="16" viewBox="0 0 20 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="6" width="2" height="4" fill="#CAB3E1"/>
                    <rect x="4" y="5" width="2" height="6" fill="#CAB3E1"/>
                    <rect x="6" y="4" width="2" height="8" fill="#CAB3E1"/>
                    <rect x="8" y="2" width="2" height="12" fill="#CAB3E1"/>
                    <g id="sound-waves">
                        <rect x="12" y="5" width="2" height="6" fill="#8364A2"/>
                        <rect x="15" y="3" width="2" height="10" fill="#8364A2"/>
                    </g>
                </svg>
            </div>
            <canvas id="spectrum" width="100" height="24" class="border-2 border-t-dark-black border-l-dark-black border-r-twisted-200 border-b-twisted-200"></canvas>
            <div id="taskbar-clock"
                class="!font-vintage !text-base !bg-twisted-600 !text-absolute-white !px-3 !py-1 !border-2 !border-t-dark-black !border-l-dark-black !border-r-twisted-200 !border-b-twisted-200 min-w-20 text-center">
                00:00 00
            </div>
        </div>
    </div>
</div>

<div class="-z-10 bg-surface fixed top-0 left-0 bottom-0 right-0"></div>

<template id="window-template">
    <div class="absolute window resize flex flex-col overflow-hidden" style="min-width: 200px; min-height: 200px; left: 300px; top: 300px; width: 300px; height: 300px;">
        <div class="title-bar">
            <label class="title-bar-text w-full">TITLE</label>
            <div class="title-bar-controls">
                <button class="max-button" aria-label="Maximize"></button>
                <button class="close-button" aria-label="Close">X</button>
            </div>
        </div>
        <div class="window-body h-full flex-1">
            <iframe class="w-full h-full src-frame" src="about:blank" frameborder="0"></iframe>
        </div>
    </div>
</template>

<audio id="bg-music" loop>
    <source src="{% static 'audio/bg.mp3' %}" type="audio/mpeg">
</audio>

<script>
    let windowCounter = 0;
    let currentMaximisedWindow = null;


    window.addEventListener("message", (event) => {
        const data = event.data;
        if (data.type != 'internal') return;
        if (data.action == 'open') {
            let w = 400, h = 400;
            if (data.width) w = data.width;
            if (data.height) h = data.height;
            newWindow(data.title, data.src, w, h);
        }
    }, false);
 
    function newWindow(title, src, w = 400, h = 400) {
        const template = document.getElementById('window-template');
        const container = document.getElementById('windows-container');
        const clone = template.content.cloneNode(true);
        const win = clone.querySelector('.window');
        const id = 'win-' + (++windowCounter);
        win.dataset.winId = id;
 
        win.querySelector('.title-bar-text').textContent = title;
        win.querySelector('.src-frame').src = src;

        x = Math.random() * (window.innerWidth - w)
        y = Math.random() * (window.innerHeight - w)

        win.style.left = x + "px";
        win.style.top = y + "px";
        win.style.width = w + "px";
        win.style.height = h + "px";
        container.appendChild(clone);
 
        const realWin = container.querySelector('[data-win-id="' + id + '"]');
 
        // Taskbar button with round png icon
        const taskBtn = document.createElement('button');
        taskBtn.dataset.winId = id;
        taskBtn.className = "flex items-center gap-1 !bg-twisted-600 !text-absolute-white text-sm !px-2 !py-1 !border-2 !border-t-twisted-200 !border-l-twisted-200 !border-r-dark-black !border-b-dark-black max-w-40";
        taskBtn.innerHTML = '<img src="{% static "images/round-square.jpg" %}" class="w-4 h-4 object-cover shrink-0"><span class="truncate">' + title + '</span>';
        taskBtn.onclick = () => focusWindow(id);
        document.getElementById('taskbar-windows').appendChild(taskBtn);
 
        realWin.querySelector('.title-bar').addEventListener('mousedown', () => focusWindow(id));
        dragWindow(realWin);
        focusWindow(id);
        realWin.querySelector('.max-button').addEventListener('mouseup', () => {
            console.log('maximise!');
            fullscreenWindow(realWin);
        });
        realWin.querySelector('.close-button').addEventListener('mouseup', () => {
            console.log('close!');
            realWin.remove();
            taskBtn.remove();
        });
    }
    
    function fullscreenWindow(win) {
        if (currentMaximisedWindow != null && currentMaximisedWindow.win == win) {
            win.style.left = currentMaximisedWindow.left;
            win.style.top = currentMaximisedWindow.top;
            win.style.width = currentMaximisedWindow.width;
            win.style.height = currentMaximisedWindow.height;
            win.classList.add('resize');

            currentMaximisedWindow = null;
            return
        }
        if (currentMaximisedWindow != null) {
            fullscreenWindow(currentMaximisedWindow.win);
        }
        currentMaximisedWindow = {
            win: win,
            left: win.style.left,
            top: win.style.top,
            width: win.style.width,
            height: win.style.height
        }
        win.style.left = "0px";
        win.style.top = "0px";
        win.style.bottom = document.getElementById('taskbar').offsetHeight+"px";
        win.style.right = "0px";
        win.style.width = null;
        win.style.height = null;
        win.classList.remove('resize');
    }

    function focusWindow(id) {
        document.querySelectorAll('#taskbar-windows button').forEach(b =>
            b.classList.remove('!bg-twisted-999'));
        const win = document.querySelector('.window[data-win-id="' + id + '"]');
        
        container = document.getElementById('windows-container')
        container.moveBefore(win, null)

        const btn = document.querySelector('#taskbar-windows button[data-win-id="' + id + '"]');
        if (btn) btn.classList.add('!bg-twisted-999');
    }
 
    function dragWindow(mywindow) {
        
        const titleBar = mywindow.getElementsByClassName('title-bar')[0];
        let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0, pendingX = 0, pendingY = 0, rafId = null;
 
        function apply() {
            rafId = null;
            mywindow.style.left = pendingX + "px";
            mywindow.style.top = pendingY + "px";
        }
 
        function onMove(e) {
            if (currentMaximisedWindow != null && currentMaximisedWindow.win == mywindow) {
                return;
            }
            if (!dragging) return;
            e.preventDefault();
            const rect = mywindow.getBoundingClientRect();
            let x = origX + (e.clientX - startX);
            let y = origY + (e.clientY - startY);
            // clamp to viewport
            x = Math.max(0, Math.min(x, window.innerWidth - rect.width));
            y = Math.max(0, Math.min(y, window.innerHeight - rect.height));
            pendingX = x;
            pendingY = y;
            // throttle DOM writes to one per animation frame for smoothness
            if (rafId === null) rafId = requestAnimationFrame(apply);

        }
 
        function onUp() {
            dragging = false;
            document.body.style.userSelect = '';
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
        }
 
        titleBar.addEventListener('mousedown', (e) => {
            e.preventDefault();
            dragging = true;
            startX = e.clientX;
            startY = e.clientY;
            origX = mywindow.offsetLeft;
            origY = mywindow.offsetTop;
            document.body.style.userSelect = 'none';
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });
    }
 
    function updateClock() {
        const now = new Date();
        let h = now.getHours();
        const m = now.getMinutes().toString().padStart(2, "0");
        const ampm = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        document.getElementById("taskbar-clock").textContent = h + ":" + m + " " + ampm;
    }
 
    function toggleStartMenu(event) {
        event.stopPropagation();
        const menu = document.getElementById("start-menu");
        menu.style.display = (menu.style.display === "none") ? "block" : "none";
    }
 
    document.addEventListener("click", (e) => {
        const menu = document.getElementById("start-menu");
        if (menu.style.display !== "none" && !menu.contains(e.target)) {
            menu.style.display = "none";
        }
    });
 
    updateClock();
    setInterval(updateClock, 1000);
 
    const music = document.getElementById("bg-music");
    const savedTime = parseFloat(sessionStorage.getItem("musicTime") || "0");
    const wasPlaying = sessionStorage.getItem("musicPlaying") === "true";
    if (savedTime) music.currentTime = savedTime;
 
    let audioCtx, analyser, dataArray, sourceConnected = false;
    const canvas = document.getElementById("spectrum");
    const ctx = canvas ? canvas.getContext("2d") : null;
 
    function initAudioGraph() {
        if (sourceConnected) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
        const source = audioCtx.createMediaElementSource(music);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        sourceConnected = true;
        drawSpectrum();
    }
 
    function playMusic() {
        initAudioGraph();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        music.play().catch(() => {});
    }
 
    function toggleMusic() {
        if (music.paused) { playMusic(); }
        else { music.pause(); }
    }
 
    if (wasPlaying) {
        playMusic();
        const resumeOnce = () => {
            playMusic();
            document.removeEventListener("pointerdown", resumeOnce);
            document.removeEventListener("keydown", resumeOnce);
        };
        document.addEventListener("pointerdown", resumeOnce, { once: true });
        document.addEventListener("keydown", resumeOnce, { once: true });
    }
 
    setInterval(() => {
        sessionStorage.setItem("musicTime", music.currentTime);
        sessionStorage.setItem("musicPlaying", (!music.paused).toString());
    }, 400);
    window.addEventListener("beforeunload", () => {
        sessionStorage.setItem("musicTime", music.currentTime);
        sessionStorage.setItem("musicPlaying", (!music.paused).toString());
    });
 
    function drawSpectrum() {
        if (!ctx) return;
        requestAnimationFrame(drawSpectrum);
        ctx.fillStyle = "#1E072F";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (!analyser || music.paused) return;
        analyser.getByteFrequencyData(dataArray);
        const bars = 8, barWidth = canvas.width / bars, pixel = 3;
        for (let i = 0; i < bars; i++) {
            const value = dataArray[i] / 255;
            const barHeight = Math.floor((value * canvas.height) / pixel) * pixel;
            for (let y = 0; y < barHeight; y += pixel) {
                const ratio = y / canvas.height;
                ctx.fillStyle = ratio > 0.6 ? "#CAB3E1" : ratio > 0.3 ? "#8364A2" : "#5A4471";
                ctx.fillRect(i * barWidth + 1, canvas.height - y - pixel, barWidth - 2, pixel - 1);
            }
        }
    }
    drawSpectrum();
</script>

{% endblock body %}
