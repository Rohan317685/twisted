{% extends "client/osbase.html" %} {% load static %} {% block body %}
<main class="h-full w-full bg-gradbg text-foreground p-5 overflow-clip">
    <img src="{% static 'images/twisted_logo.png' %}" alt=""
        class="fixed inset-0 z-0 bg-[url('static/images/twisted_logo.png')] pointer-events-none select-none my-auto justify-self-center opacity-60 bg-contain bg-scale scale-95 drop-shadow-lg shadow-primary" />
    <div class="relative z-10">
        <div class="flex flex-col flex-wrap content-start gap-3 w-full h-full overflow-y-hidden">
            {% if user.profile.is_staff %}
            <div class="font-vintage w-fit cursor-pointer select-none">
                <a href="{% url 'admin.dash' %}">
                    <div class="size-15 bg-secondary border rounded-md flex items-center justify-center text-3xl">🛡️
                    </div>
                    <span class="text-white block text-center text-sm">Admin</span>
                </a>
            </div>
            {% endif %}
            <div class="font-vintage w-fit cursor-pointer select-none" data-url="{% url 'fr.projects' %}"
                onclick="newWindow('Projects', this.dataset.url)">
                <div class="size-15 bg-secondary border rounded-md flex items-center justify-center">
                    <img src="{% static 'images/directory.png' %}" class="size-10" alt="">
                </div>
                <span class="block text-center text-sm">Projects</span>
            </div>
            <div class="font-vintage w-fit cursor-pointer select-none" data-url="{% url 'fr.pathways' %}"
                onclick="newWindow('Pathways', this.dataset.url)">
                <div class="size-15 bg-secondary border rounded-md flex items-center justify-center text-3xl">🛣️</div>
                <span class="block text-center text-sm">Pathways</span>
            </div>
        </div>

        <div id="windows-container"></div>

        <nav id="taskbar"
            class="fixed bottom-0 left-0 right-0 z-50 flex h-12 items-center justify-between gap-2 border-t border-border bg-card px-2 sm:px-3">
            <div class="relative">
                <button onclick="toggleStartMenu(event)"
                    class="flex shrink-0 items-center gap-1.5 sm:gap-2 border border-border bg-secondary px-2 sm:px-3 py-1.5 font-mono text-xs sm:text-sm font-bold text-secondary-foreground transition hover:bg-primary hover:text-primary-foreground">
                    <img src="{% static 'images/twisted_logo.png' %}" class="h-4 w-6 object-contain" alt="">
                    Twisted
                </button>

                <div id="start-menu" style="display: none;"
                    class="z-10000 fixed bottom-12 left-1 bg-twisted-800 border-2 border-t-twisted-200 border-l-twisted-200 border-r-dark-black border-b-dark-black shadow-lg">
                    <div class="flex h-80">
                        <div class="w-44 bg-twisted-600 p-3 pt-10 flex flex-col">
                            <div class="text-center mb-3">
                                <img src="{{ user.profile.slack_pfp_url }}" alt=""
                                    class="w-16 h-16 object-cover mx-auto mb-1 -mt-12 border-2 border-t-twisted-200 border-l-twisted-200 border-r-dark-black border-b-dark-black shadow-lg" />
                                <div class="text-absolute-white font-bold text-sm font-vintage">
                                    {{ profile.slack_username|default:user.username }}
                                </div>
                            </div>

                            <div
                                class="font-vintage space-y-1 text-absolute-white text-sm border-t border-twisted-800 pt-2">
                                {% if user.is_staff %}
                                <a href="/admin/" class="block text-absolute-white px-2 py-1 hover:bg-twisted-800">Admin
                                    Panel</a>
                                {% endif %}
                                <a href="https://docs.twisted.hackclub.com/"
                                    class="block text-absolute-white px-2 py-1 hover:bg-twisted-800">Docs</a>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between bg-twisted-400 p-2 border-t-2 border-t-twisted-200">
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit"
                                class="text-absolute-white text-sm px-3 py-1 border-2 border-t-twisted-200 border-l-twisted-200 border-r-dark-black border-b-dark-black active:border-t-dark-black active:border-l-dark-black active:border-r-twisted-200 active:border-b-twisted-200">
                                Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div id="taskbar-windows" class="flex-1 flex items-center gap-1 px-2 overflow-x-auto"></div>

            <div class="flex items-center gap-2">
                <button id="speaker-btn" type="button" onclick="toggleMusic()" aria-label="Toggle music"
                    class="flex h-8 items-center border border-border bg-secondary px-2 text-secondary-foreground transition hover:bg-muted">
                    <svg id="speaker-icon" width="20" height="16" viewBox="0 0 20 16" shape-rendering="crispEdges"
                        xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="6" width="2" height="4" fill="#E0A7FF" />
                        <rect x="4" y="5" width="2" height="6" fill="#E0A7FF" />
                        <rect x="6" y="4" width="2" height="8" fill="#E0A7FF" />
                        <rect x="8" y="2" width="2" height="12" fill="#E0A7FF" />

                        <g id="sound-waves">
                            <rect x="12" y="5" width="2" height="6" fill="#B96CFF" />
                            <rect x="15" y="3" width="2" height="10" fill="#B96CFF" />
                        </g>
                    </svg>
                </button>

                <canvas id="spectrum" width="100" height="24" class="hidden border border-border sm:block"></canvas>

                <div id="taskbar-clock"
                    class="min-w-20 border border-border bg-background px-3 py-1.5 text-center font-mono text-xs text-foreground">
                    00:00 AM
                </div>
            </div>

        </nav>
    </div>
</main>

<template id="window-template">
    <div class="absolute resize window flex flex-col overflow-hidden bg-card border-2 border-dark-black shadow-lg"
        style="min-width: 200px; min-height: 200px; left: 300px; top: 300px; width: 300px; height: 300px;">
        <div
            class="title-bar w-full h-8 shrink-0 flex items-center justify-between bg-primary text-primary-foreground px-2 select-none">
            <div class="flex gap-2">
                <button
                    class="reload-button h-5 w-5 flex items-center justify-center bg-card text-card-foreground border border-border hover:bg-secondary"
                    type="button" aria-label="Reload">
                    ↻
                </button>
                <label class="title-bar-text font-bold truncate">[ title card ]</label>
            </div>

            <div class="title-bar-controls flex items-center gap-1">

                <button id="max-button"
                    class=" max-button h-5 w-5 flex items-center justify-center bg-card text-card-foreground border border-border hover:bg-secondary"
                    type="button" aria-label="Maximize">
                    □
                </button>

                <button
                    class="close-button h-5 w-5 flex items-center justify-center bg-card text-card-foreground border border-border hover:bg-destructive hover:text-destructive-foreground"
                    type="button" aria-label="Close">
                    ×
                </button>
            </div>
        </div>

        <div class="window-body min-h-0 flex-1 overflow-hidden">
            <iframe class="w-full h-full block src-frame select-none border-0" src="about:blank"
                frameborder="0"></iframe>
            </div>
            <div class="resize-handle resize-n"></div>
            <div class="resize-handle resize-s"></div>
            <div class="resize-handle resize-e"></div>
            <div class="resize-handle resize-w"></div>
            <div class="resize-handle resize-ne"></div>
            <div class="resize-handle resize-nw"></div>
            <div class="resize-handle resize-se"></div>
            <div class="resize-handle resize-sw"></div>
        </div>
</template>

<audio id="bg-music" loop>
    <source src="{% static 'audio/bg.mp3' %}" type="audio/mpeg" />
</audio>

<script>
    let windowCounter = 0;
    let currentMaximisedWindow = null;

    window.addEventListener(
        "message",
        (event) => {
            const data = event.data;
            if (data.type != "internal") return;
            if (data.action == "open") {
                let w = 600,
                    h = 600;
                if (data.width) w = data.width;
                if (data.height) h = data.height;
                newWindow(data.title, data.src, w, h);
            }
        },
        false,
    );

    function newWindow(title, src, w = 600, h = 600) {
        const template = document.getElementById("window-template");
        const container = document.getElementById("windows-container");
        const clone = template.content.cloneNode(true);
        const win = clone.querySelector(".window");
        const id = "win-" + ++windowCounter;
        win.dataset.winId = id;

        win.querySelector(".title-bar-text").textContent = title;
        win.querySelector(".src-frame").src = src;

        x = Math.random() * (window.innerWidth - w);
        y = Math.random() * (window.innerHeight - w);

        win.style.left = x + "px";
        win.style.top = y + "px";
        win.style.width = w + "px";
        win.style.height = h + "px";
        container.appendChild(clone);

        const realWin = container.querySelector('[data-win-id="' + id + '"]');

        // Taskbar button with round png icon
        const taskBtn = document.createElement("button");
        taskBtn.dataset.winId = id;
        taskBtn.className =
            "flex items-center gap-1 !bg-twisted-600 !text-absolute-white text-sm !px-2 !py-1 !border-2 !border-t-twisted-200 !border-l-twisted-200 !border-r-dark-black !border-b-dark-black max-w-40";
        const taskIcon = document.createElement("img");
        taskIcon.src = '{% static "images/round-square.jpg" %}';
        taskIcon.className = "w-4 h-4 object-cover shrink-0";
        const taskTitle = document.createElement("span");
        taskTitle.className = "truncate";
        taskTitle.textContent = title;
        taskBtn.append(taskIcon, taskTitle);
        taskBtn.onclick = () => focusWindow(id);
        document.getElementById("taskbar-windows").appendChild(taskBtn);

        realWin.querySelector(".title-bar").addEventListener("mousedown", () => focusWindow(id));
        dragWindow(realWin);
        initResizeHandles(realWin);
        focusWindow(id);
        realWin.querySelector(".max-button").addEventListener("click", () => {
            fullscreenWindow(realWin);
        });
        realWin.querySelector(".title-bar-controls").addEventListener("mousedown", (event) => {
            event.stopPropagation();
        });
        realWin.querySelector(".reload-button").addEventListener("mouseup", () => {
            frame = realWin.querySelector(".src-frame");
            frame.src = frame.src;
        });
        realWin.querySelector(".close-button").addEventListener("mouseup", () => {
            console.log("close!");
            realWin.remove();
            taskBtn.remove();
        });
    }

    function fullscreenWindow(win) {
        if (currentMaximisedWindow?.win === win) {
            const previous = currentMaximisedWindow;

            win.style.position = previous.position;
            win.style.left = previous.left;
            win.style.top = previous.top;
            win.style.right = previous.right;
            win.style.bottom = previous.bottom;
            win.style.width = previous.width;
            win.style.height = previous.height;

            win.classList.add("resize");

            currentMaximisedWindow = null;
            return;
        }

        if (currentMaximisedWindow) {
            fullscreenWindow(currentMaximisedWindow.win);
        }

        currentMaximisedWindow = {
            win,
            position: win.style.position,
            left: win.style.left,
            top: win.style.top,
            right: win.style.right,
            bottom: win.style.bottom,
            width: win.style.width,
            height: win.style.height,
        };

        const taskbar = document.getElementById("taskbar");
        const taskbarHeight = taskbar?.offsetHeight || 48;

        win.classList.remove("resize");

        win.style.position = "fixed";
        win.style.left = "0";
        win.style.top = "0";
        win.style.right = "0";
        win.style.bottom = `${taskbarHeight}px`;
        win.style.width = "auto";
        win.style.height = "auto";
    }

    function focusWindow(id) {
        document.querySelectorAll("#taskbar-windows button").forEach((b) => b.classList.remove("!bg-twisted-999"));
        const win = document.querySelector('.window[data-win-id="' + id + '"]');

        container = document.getElementById("windows-container");
        container.moveBefore(win, null);

        const btn = document.querySelector('#taskbar-windows button[data-win-id="' + id + '"]');
        if (btn) btn.classList.add("!bg-twisted-999");
    }

    function dragWindow(mywindow) {
        const titleBar = mywindow.getElementsByClassName("title-bar")[0];
        let dragging = false,
            startX = 0,
            startY = 0,
            origX = 0,
            origY = 0,
            pendingX = 0,
            pendingY = 0,
            rafId = null;

        function apply() {
            rafId = null;
            mywindow.style.left = pendingX + "px";
            mywindow.style.top = pendingY + "px";
        }

        function onMove(e) {
            if (currentMaximisedWindow != null && currentMaximisedWindow.win == mywindow) {
                return;
            }
            if (!dragging) return;
            e.preventDefault();
            const rect = mywindow.getBoundingClientRect();
            let x = origX + (e.clientX - startX);
            let y = origY + (e.clientY - startY);
            const viewportWidth = document.documentElement.clientWidth;
            const viewportHeight = document.documentElement.clientHeight;
            const maxX = Math.max(0, viewportWidth - rect.width);
            const maxY = Math.max(0, viewportHeight - rect.height);
            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));
            pendingX = x;
            pendingY = y;
            // throttle DOM writes to one per animation frame for smoothness
            if (rafId === null) rafId = requestAnimationFrame(apply);
        }

        function onUp() {
            dragging = false;
            document.body.style.userSelect = "";
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
        }

        titleBar.addEventListener("mousedown", (e) => {
            e.preventDefault();
            dragging = true;
            startX = e.clientX;
            startY = e.clientY;
            origX = mywindow.offsetLeft;
            origY = mywindow.offsetTop;
            document.body.style.userSelect = "none";
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onUp);
        });
    }

    function initResizeHandles(mywindow) {
        const handles = mywindow.querySelectorAll(".resize-handle");
        const frame = mywindow.querySelector(".src-frame");
        handles.forEach((handle) => {
            handle.addEventListener("mousedown", (e) => {
                e.preventDefault();
                if (!mywindow.classList.contains("resize")) return;
                const dir = handle.classList[1].replace("resize-", "");
                const startX = e.clientX;
                const startY = e.clientY;
                const startLeft = mywindow.offsetLeft;
                const startTop = mywindow.offsetTop;
                const startWidth = mywindow.offsetWidth;
                const startHeight = mywindow.offsetHeight;
                const minW = 200;
                const minH = 200;
                const oldPointerEvents = frame.style.pointerEvents;
                frame.style.pointerEvents = "none";

                function onMove(ev) {
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    let newLeft = startLeft;
                    let newTop = startTop;
                    let newWidth = startWidth;
                    let newHeight = startHeight;

                    if (dir.includes("e")) newWidth = Math.max(minW, startWidth + dx);
                    if (dir.includes("s")) newHeight = Math.max(minH, startHeight + dy);
                    if (dir.includes("w")) {
                        newWidth = Math.max(minW, startWidth - dx);
                        newLeft = startLeft + (startWidth - newWidth);
                    }
                    if (dir.includes("n")) {
                        newHeight = Math.max(minH, startHeight - dy);
                        newTop = startTop + (startHeight - newHeight);
                    }
                    
                    mywindow.style.left = newLeft + "px";
                    mywindow.style.top = newTop + "px";
                    mywindow.style.width = newWidth + "px";
                    mywindow.style.height = newHeight + "px";
                }

                function onUp() {
                    frame.style.pointerEvents = oldPointerEvents;
                    document.removeEventListener("mousemove", onMove);
                    document.removeEventListener("mouseup", onUp);
                    document.body.style.userSelect = "";
                }

                document.body.style.userSelect = "none";
                document.addEventListener("mousemove", onMove);
                document.addEventListener("mouseup", onUp);
            });
        });
    }

    function updateClock() {
        const now = new Date();
        let h = now.getHours();
        const m = now.getMinutes().toString().padStart(2, "0");
        const ampm = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        document.getElementById("taskbar-clock").textContent = h + ":" + m + " " + ampm;
    }

    function toggleStartMenu(event) {
        event.stopPropagation();
        const menu = document.getElementById("start-menu");
        menu.style.display = menu.style.display === "none" ? "block" : "none";
    }

    document.addEventListener("click", (e) => {
        const menu = document.getElementById("start-menu");
        if (menu.style.display !== "none" && !menu.contains(e.target)) {
            menu.style.display = "none";
        }
    });

    updateClock();
    setInterval(updateClock, 1000);

    const music = document.getElementById("bg-music");
    const savedTime = parseFloat(sessionStorage.getItem("musicTime") || "0");
    const wasPlaying = sessionStorage.getItem("musicPlaying") === "true";
    if (savedTime) music.currentTime = savedTime;

    let audioCtx,
        analyser,
        dataArray,
        sourceConnected = false;
    const canvas = document.getElementById("spectrum");
    const ctx = canvas ? canvas.getContext("2d") : null;

    function initAudioGraph() {
        if (sourceConnected) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
        const source = audioCtx.createMediaElementSource(music);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        sourceConnected = true;
        drawSpectrum();
    }

    function playMusic() {
        initAudioGraph();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        music.play().catch(() => { });
    }

    function toggleMusic() {
        if (music.paused) {
            playMusic();
        } else {
            music.pause();
        }
    }

    if (wasPlaying) {
        playMusic();
        const resumeOnce = () => {
            playMusic();
            document.removeEventListener("pointerdown", resumeOnce);
            document.removeEventListener("keydown", resumeOnce);
        };
        document.addEventListener("pointerdown", resumeOnce, { once: true });
        document.addEventListener("keydown", resumeOnce, { once: true });
    }

    setInterval(() => {
        sessionStorage.setItem("musicTime", music.currentTime);
        sessionStorage.setItem("musicPlaying", (!music.paused).toString());
    }, 400);
    window.addEventListener("beforeunload", () => {
        sessionStorage.setItem("musicTime", music.currentTime);
        sessionStorage.setItem("musicPlaying", (!music.paused).toString());
    });

    function drawSpectrum() {
        if (!ctx) return;
        requestAnimationFrame(drawSpectrum);
        ctx.fillStyle = "#1E072F";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (!analyser || music.paused) return;
        analyser.getByteFrequencyData(dataArray);
        const bars = 8,
            barWidth = canvas.width / bars,
            pixel = 3;
        for (let i = 0; i < bars; i++) {
            const value = dataArray[i] / 255;
            const barHeight = Math.floor((value * canvas.height) / pixel) * pixel;
            for (let y = 0; y < barHeight; y += pixel) {
                const ratio = y / canvas.height;
                ctx.fillStyle = ratio > 0.6 ? "#CAB3E1" : ratio > 0.3 ? "#8364A2" : "#5A4471";
                ctx.fillRect(i * barWidth + 1, canvas.height - y - pixel, barWidth - 2, pixel - 1);
            }
        }
    }
    drawSpectrum();
</script>

{% endblock body %}
