{% extends "base.html" %}
{% load static %}
{% block body %}
<div class="m-4">
    <h1 class="font-bold text-4xl">twisted</h1>
    <div>
        meow :3
    </div>
    <div>
        welcome to twisted
    </div>
    <div>
        <img src="{% static 'images/twisted_logo_big.png' %}" alt="">

            <button type="submit" class="bg-blue-400 text-2xl py-4 px-8 m-2 rounded-xl">login</button>

    </div>
</div>
{% endblock body %}
