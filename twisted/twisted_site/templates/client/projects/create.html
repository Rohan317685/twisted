{% extends "client/osbase.html" %} {% block body %}
<div class="bg-surface flex flex-col w-full h-full font-vintage">
    {% if complete %}
    <div class="text-center">
        <div class="text-xl">
            Your project has been created!
        </div>
        <div>
            You can now close this window.
        </div>
    </div>
    {% else %}
    <form method="post" class="h-max w-full flex-1 scrollbar-win9x">
        {% csrf_token %}
        <div class="field-row-stacked">
            <label for="name">Project name</label>
            <input id="name" name="name" type="text" required />
        </div>
        <div class="field-row-stacked">
            <label for="description">Project description</label>
            <textarea id="description" name="description" rows="4" required></textarea>
        </div>

        <div class="mt-2 field-row-stacked">
            <label for="type">Project type</label>
            <select id="type" name="type" required>
                <option value="" disabled selected hidden>Select an option</option>
                <option value="software">Software</option>
                <option value="hardware">Hardware</option>
            </select>
        </div>

        <button class="mt-2">Create</button>
    </form>

    {% endif %}
</div>
{% endblock body %}
