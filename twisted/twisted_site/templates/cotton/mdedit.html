<div class="flex flex-col {{ class }}">
    <div>
        <button id="editbutton" type="button" onclick="switchedit()" disabled>Edit</button>
        <button id="previewbutton" type="button" onclick="switchpreview()">Preview</button>
    </div>
    <div class="flex-1">
        <div class="!text-lg h-full flex flex-col" id="edittab">
            <div class="flex-1">
                <textarea name="content" id="content" class="w-full h-full text-2xl! resize-none" oninput="renderpreview()">{{ content }}</textarea>
            </div>
        </div>
        <div id="previewtab" style="display: none;" class="h-full flex flex-col">
            <div class="overflow-y-auto flex-1 bg-twisted-600 p-1">
                <div id="preview" class="zoom-150 [&_h1,h2,h3,h4,h5,h6]:zoom-40 [&_ul,ol]:list-outside [&_ul,ol]:pl-5 [&_ul]:list-disc [&_ol]:list-decimal *:my-1">
                </div>
            </div>
        </div>
    </div>
    
    <script>
        textbox = document.querySelector('#content')
        console.log(textbox)
        csrfToken = "{{ csrf_token }}"
    
        function generateRandomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }
    
        function renderpreview() {
            console.log('rendering...');
            content = textbox.value;
            parsed = DOMPurify.sanitize(marked.parse(content));
            document.getElementById('preview').innerHTML = parsed;
        }
        function switchedit() {
            document.getElementById('previewtab').style.display = 'none';
            document.getElementById('edittab').style.display = null;
            
            document.getElementById('editbutton').disabled = true;
            document.getElementById('previewbutton').disabled = null;
        }
        function switchpreview() {
            document.getElementById('previewtab').style.display = null;
            document.getElementById('edittab').style.display = 'none';
    
            document.getElementById('editbutton').disabled = null;
            document.getElementById('previewbutton').disabled = true;
        }
    
    
        textbox.addEventListener('paste', (event) => {
            console.log('paste detect!')
            const items = (event.clipboardData || window.clipboardData).items;
    
            for (let i = 0; i < items.length; i++) {
                if (!items[i].type.startsWith('image/')) {
                    continue;
                }
                console.log("found image!")
                const blob = items[i].getAsFile();
    
                const id = `![Uploading... ${generateRandomString(5)}]()`
    
                textbox.value = textbox.value + id + '\n'
    
                const formData = new FormData();
                formData.append('csrfmiddlewaretoken', csrfToken);
                formData.append('file', blob);
                formData.append('ref', 'journals');
    
                // 4. Send the POST request to your backend URL
                response = fetch("{% url 'misc.upload_file' %}", {
                    method: 'POST',
                    body: formData, // Fetch automatically sets Content-Type to multipart/form-data
                });
                response.then((response) => {
                    console.log(response);
                    response.json().then((result) => {
                        console.log(result);
                        if (result['status'] == 'ok') {
                            console.log('Upload successful:', result);
                            textbox.value = textbox.value.replace(id, `![${result['name']}](${result['link']})`);
                        } else {
                            console.log('Upload failed:', result);
                            textbox.value = textbox.value.replace(id, `![Error: ${result['reason']}]()`);
                        }
                        renderpreview()
                    })
                });
                    
            }
        });
    </script>
</div>
