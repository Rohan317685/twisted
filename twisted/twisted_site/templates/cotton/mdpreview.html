<div class="{{ class }}">
    <div class="w-full previewdiv zoom-100 [&_h1,h2,h3,h4,h5,h6]:zoom-40 [&_ul,ol]:list-outside [&_ul,ol]:pl-5 [&_ul]:list-disc [&_ol]:list-decimal *:my-1">
    </div>
    <textarea class="textbox">{{ slot }}</textarea>
    <script>
        function rendermarkdown() {
            console.log('rendering markdown...');
            elem = document.currentScript.parentElement.querySelector('.textbox')
            content = elem.value;
            elem.classList.add('hidden')
            parsed = DOMPurify.sanitize(marked.parse(content));
            elem.parentElement.querySelector('.previewdiv');
            console.log(elem)
            elem.parentElement.querySelector('.previewdiv').innerHTML = parsed;
        }
        rendermarkdown()
    </script>
</div>
